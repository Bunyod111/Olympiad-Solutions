<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Olympiad 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="lang-switcher">
            <button type="button" id="btn-ru" class="active-lang">RU</button>
            <button type="button" id="btn-uz">UZ</button>
            <button type="button" id="btn-en">EN</button>
        </div>

        <header>
            <h1 id="main-title">Олимпиада по математике 2026</h1>
            <p id="sub-title">Пожалуйста, зарегистрируйтесь, чтобы начать.</p>
        </header>

        <section id="registration-section" class="active-section">
            <form id="registration-form">
                <div class="form-group">
                    <label for="lastName" id="label-lastname">Фамилия:</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label for="firstName" id="label-firstname">Имя:</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="patronymic" id="label-patronymic">Отчество:</label>
                    <input type="text" id="patronymic">
                </div>
                <div class="form-group">
                    <label for="phone" id="label-phone">Телефон:</label>
                    <input type="tel" id="phone" required>
                </div>
                
                <div class="form-group hidden" id="email-group">
                    <label for="email" id="label-email">Email:</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group">
                    <label for="grade" id="label-grade">Класс:</label>
                    <select id="grade" required>
                        <option value="" disabled selected id="opt-default">Выберите класс</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                    </select>
                </div>
                <button type="submit" id="reg-submit-btn">Начать олимпиаду</button>
            </form>
        </section>

        <section id="quiz-section" class="hidden-section">
            <div id="timer-display" style="display:none;">00:00</div>
            <h2 id="quiz-header">Задания</h2>
            <form id="quiz-form">
                </form>
            <button type="submit" form="quiz-form" id="quiz-submit-btn">Отправить ответы</button>
        </section>

        <section id="result-section" class="hidden-section">
            <h2 id="result-title">Результаты</h2>
            <div id="result-message"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
